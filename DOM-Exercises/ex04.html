<!doctype html>
<html lang="en">

<head>
    <title>Ex04</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS v5.3.3 -->
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>

    </header>
    <main>
        <h1 class="text-center py-3">Ex04 - Confirm & Show/Hide Password</h1>
        <div class="container">
            <form action="#" method="post">
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" id="password" placeholder="" required>
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" name="confirmPassword" id="confirmPassword" required
                        placeholder="">
                </div>
                <div class="form-check form-check-inline mb-3">
                    <input class="form-check-input" type="checkbox" id="showPassword" value="true">
                    <label class="form-check-label" for="showPassword">Show Passwords</label>
                </div>
                <div>
                    <button type="submit" class="btn btn-primary">Update</button>
                </div>
            </form>
        </div>
    </main>
    <footer>
        <!-- place footer here -->
    </footer>
    <!-- Bootstrap JavaScript Libraries -->
    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js">
    </script>
    <script>
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");
        const showPassword = document.getElementById("showPassword");

        const showPasswordHandler = () => {
            if (showPassword.checked) {
                password.type = 'text';
                confirmPassword.type = 'text';
            } else {
                password.type = 'password';
                confirmPassword.type = 'password';
            };
        }
        showPassword.addEventListener('change', showPasswordHandler);

        // const validatePassword = (event) => {
        //     if (password.value !== confirmPassword.value) {
        //         event.preventDefault();
        //         confirmPassword.setCustomValidity('Password does not match!');
        //         confirmPassword.reportValidity();
        //     } else {
        //         confirmPassword.setCustomValidity('');
        //     }
        // };

        function validatePassword(event) {
            if (password.value !== confirmPassword.value) {
                event.preventDefault();
                confirmPassword.setCustomValidity("Password does not match!");
                confirmPassword.reportValidity();
            } else {
                confirmPassword.setCustomValidity('');
            }
        }

        password.addEventListener('change', () => {
            if (password.value !== confirmPassword.value) {
                event.preventDefault();
                confirmPassword.setCustomValidity("Password does not match!");
                confirmPassword.reportValidity();
            } else {
                confirmPassword.setCustomValidity('');
            }
        });
        confirmPassword.addEventListener('input', validatePassword);
    </script>

</body>

</html>
